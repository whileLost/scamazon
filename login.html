<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WMS Platform</title>
    <link rel="icon" type="image/jpg" href="/img/scamazon.jpg">
    
    <!-- Preconnect to Google Fonts for performance optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = 
        {
            darkMode: 'class',
            theme: 
            {
                extend: 
                {
                    fontFamily: 
                    {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // load theme
        try 
        {
            const savedTheme = localStorage.getItem('scamazon_theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) 
            {
                document.documentElement.classList.add('dark');
            } 
            else 
            {
                document.documentElement.classList.remove('dark');
            }
        } 
        catch (err) 
        {
            console.error('Theme loader error:', err);
        }
    </script>
    <style>
        /* Custom scrollbar for brand consistency */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.05);
        }
        .dark ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(245, 158, 11, 0.4);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(245, 158, 11, 0.7);
        }

        /* Type scale */
        h1, .type-display { font-size: 1.75rem; line-height: 1.25; letter-spacing: -0.025em; text-wrap: balance; }
        h2, .type-section { font-size: 1.375rem; line-height: 1.3; letter-spacing: -0.02em; text-wrap: balance; }
        h3, .type-title { font-size: 1.0625rem; line-height: 1.35; letter-spacing: -0.015em; text-wrap: balance; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950 transition-colors duration-300">

    <!-- Navigation -->
    <header class="sticky top-0 z-50 bg-white/85 dark:bg-slate-900/85 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 shadow-xs transition-colors">
        <nav class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center" aria-label="Main Navigation">
            <a href="index.html" class="text-xl font-bold tracking-tight text-slate-900 dark:text-white hover:opacity-80 transition-opacity focus:outline-none focus:ring-2 focus:ring-amber-500 rounded-sm">
                Scamazon<span class="text-amber-600 dark:text-amber-400">.</span>
            </a>
            
            <!-- dark mode toggle -->
            <button onclick="toggleDarkMode()" type="button" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500" title="Toggle Dark Mode">
                <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
            </button>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="relative flex-grow flex items-center justify-center py-12 px-6 overflow-hidden">
        <!-- Subtle background gradient -->
        <div class="absolute inset-0 -z-10 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-500/10 via-slate-50 to-slate-50 dark:from-amber-500/5 dark:via-slate-950 dark:to-slate-900 transition-colors"></div>

        <div class="bg-white dark:bg-slate-900 p-8 rounded-xl border border-slate-200 dark:border-slate-800 shadow-xl shadow-slate-900/5 dark:shadow-black/40 w-full max-w-md transition-colors">
            <div class="text-center mb-6">
                <h1 id="form-title" class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Sign In</h1>
                <p id="form-subtitle" class="text-sm text-slate-600 dark:text-slate-300 mt-1">Access your dashboard</p>
            </div>

            <!-- Alerts -->
            <div id="error-msg" class="hidden mb-4 p-3 bg-red-50 dark:bg-red-950/50 text-red-700 dark:text-red-300 text-sm rounded-lg border border-red-200 dark:border-red-900"></div>
            <div id="success-msg" class="hidden mb-4 p-3 bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 text-sm rounded-lg border border-emerald-200 dark:border-emerald-900"></div>

            <!-- Form -->
            <form id="auth-form" class="space-y-4">
                <div id="name-container" class="hidden">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Full Name</label>
                    <input id="name" type="text" class="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 rounded-lg px-3.5 py-2.5 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all placeholder:text-slate-400 dark:placeholder:text-slate-500" placeholder="Jane Doe">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email</label>
                    <input id="email" type="email" required class="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 rounded-lg px-3.5 py-2.5 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all placeholder:text-slate-400 dark:placeholder:text-slate-500" placeholder="you@example.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
                    <input id="password" type="password" required class="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 rounded-lg px-3.5 py-2.5 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all placeholder:text-slate-400 dark:placeholder:text-slate-500" placeholder="••••••••">
                </div>

                <button type="submit" id="submit-btn" class="w-full inline-flex items-center justify-center py-2.5 px-4 text-sm font-semibold text-white dark:text-slate-950 bg-slate-900 dark:bg-amber-500 rounded-lg hover:bg-slate-800 dark:hover:bg-amber-400 hover:-translate-y-0.5 shadow-md shadow-slate-900/10 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                    Sign In
                </button>
            </form>

            <!-- Toggle -->
            <div class="mt-6 text-center text-sm text-slate-600 dark:text-slate-400">
                <span id="toggle-text">Don't have an account?</span>
                <button id="toggle-btn" type="button" class="text-amber-600 dark:text-amber-400 font-semibold hover:text-amber-700 dark:hover:text-amber-300 hover:underline ml-1 focus:outline-none focus:ring-2 focus:ring-amber-500 rounded-sm">Sign Up</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-8 transition-colors" aria-label="Site Footer">
        <div class="max-w-7xl mx-auto px-6 text-sm text-slate-500 dark:text-slate-400 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p>&copy; 2026 Scamazon WMS. All rights reserved.</p>
            <div class="flex space-x-6">
                <a href="#" class="hover:text-slate-900 dark:hover:text-white transition-colors focus:outline-none focus:underline">Privacy Policy</a>
                <a href="#" class="hover:text-slate-900 dark:hover:text-white transition-colors focus:outline-none focus:underline">Terms of Service</a>
            </div>
        </div>
    </footer>

    <script type="module">
        window.addEventListener('unhandledrejection', (event) => 
        {
            console.error('Uncaught Async Error:', event.reason);
        });

        function toggleDarkMode() 
        {
            try 
            {
                const htmlElement = document.documentElement;
                if (htmlElement.classList.contains('dark')) 
                {
                    htmlElement.classList.remove('dark');
                    localStorage.setItem('scamazon_theme', 'light');
                } 
                else 
                {
                    htmlElement.classList.add('dark');
                    localStorage.setItem('scamazon_theme', 'dark');
                }
            } 
            catch (toggleErr) 
            {
                console.error('Dark mode toggle failed:', toggleErr);
            }
        }
        window.toggleDarkMode = toggleDarkMode;

        import { client } from './supaBase.js';
        let isSignUp = false;
        
        const authForm = document.getElementById('auth-form');
        const nameInput = document.getElementById('name');
        const nameContainer = document.getElementById('name-container');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-btn');
        const toggleBtn = document.getElementById('toggle-btn');
        const toggleText = document.getElementById('toggle-text');
        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');
        const errorDiv = document.getElementById('error-msg');
        const successDiv = document.getElementById('success-msg');

        // check if signup instead
        document.addEventListener('DOMContentLoaded', () => 
        {
            try 
            {
                const urlParams = new URLSearchParams(window.location.search);
                isSignUp = urlParams.get('mode') === 'signup';

                if (isSignUp)
                {
                    openSignUp();
                }
                else
                {
                    openLogIn();
                }
            } 
            catch (loadErr) 
            {
                console.error('Init params check failed:', loadErr);
            }
        });

        toggleBtn.addEventListener('click', () => 
        {
            isSignUp = !isSignUp;
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            if (isSignUp) 
            {
                openSignUp();
            } 
            else 
            {
                openLogIn();
            }
        });

        authForm.addEventListener('submit', async (e) => 
        {
            e.preventDefault();
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            try 
            {
                if (isSignUp) 
                {
                    const name = nameInput.value.trim();
                    const { data, error } = await client.auth.signUp({
                        email,
                        password,
                        options: { data: { role: 'customer', name } }
                    });

                    if (error) throw error;

                    successDiv.textContent = 'Account created successfully. You can now sign in.';
                    successDiv.classList.remove('hidden');
                    toggleBtn.click();
                } 
                else 
                {
                    const { data: authData, error: authError } = await client.auth.signInWithPassword({
                        email,
                        password,
                    });

                    if (authError) throw authError;

                    const { data: userRecord, error: userErr } = await client
                        .from('users')
                        .select('role')
                        .eq('email', email)
                        .single();

                    if (userErr || !userRecord) 
                    {
                        throw new Error('User record could not be retrieved.');
                    }   

                    if (userRecord.role === 'storefront_owner') 
                    {
                        window.location.href = 'storefront.html';
                    } 
                    else if (userRecord.role === 'customer')
                    {
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirectTarget = urlParams.get('redirect') || 'index.html';
                        window.location.href = redirectTarget;
                    }
                    else 
                    {
                        window.location.href = `${userRecord.role}.html`;
                    }
                }
            } 
            catch (err) 
            {
                errorDiv.textContent = err.message;
                errorDiv.classList.remove('hidden');
            } 
            finally 
            {
                submitBtn.disabled = false;
                submitBtn.textContent = isSignUp ? 'Sign Up' : 'Sign In';
            }
        });

        function openSignUp()
        {
            nameContainer.classList.remove('hidden');
            formTitle.textContent = 'Create Account';
            formSubtitle.textContent = 'Register a new customer account';
            submitBtn.textContent = 'Sign Up';
            toggleText.textContent = 'Already have an account?';
            toggleBtn.textContent = 'Sign In';
        }

        function openLogIn()
        {
            nameContainer.classList.add('hidden');
            formTitle.textContent = 'Sign In';
            formSubtitle.textContent = 'Access your dashboard';
            submitBtn.textContent = 'Sign In';
            toggleText.textContent = "Don't have an account?";
            toggleBtn.textContent = 'Sign Up';
        }
    </script>
</body>
</html>
